novel:
  id: demo_novel
  title: 星枢试作
  genre: 玄幻
  language: zh
creation:
  total_volumes: 1
  total_chapters: 3
  chapter_word_target: 500
quality:
  audit_threshold: 75
  revision_max_attempts: 3
progress:
  current_volume: 1
  current_arc: 1
  current_chapter: 0
  engine_state: idle
budget:
  gen_tokens_per_chapter: 8000
  audit_tokens_per_chapter: 6000
  pipeline_ab_tokens_per_chapter: 4000
  context_slice_budget: 12000
# llm 段：外部云模型接入示例（当前为【测试用】Agnes，非引擎内置模型）。
# 引擎不内置任何厂商模型；任意 OpenAI 兼容服务（OpenAI / DeepSeek / 通义 /
# 本地 vLLM 等）均可经 model + base_url + 环境变量 Key 接入：
#   export AGNES_API_KEY=...   # 或 LLM_API_KEY / OPENAI_API_KEY / DEEPSEEK_API_KEY
llm:
  model: "agnes-2.5-flash"          # 正文生成模型（测试配置，可按需更换）
  audit_model: "agnes-2.5-flash"    # 审计模型（07 §8 建议与正文模型独立仲裁）
  base_url: "https://api.agnes-ai.cn/v1"
  temperature: 0.8